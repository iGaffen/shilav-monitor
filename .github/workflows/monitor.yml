name: Monitor Shilav page

on:
  schedule:
    # Hourly fallback safety net only. The primary 10-minute cadence is driven
    # externally (cron-job.org calling the workflow_dispatch API below) since
    # GitHub's own `schedule` trigger is unreliably delayed at high frequency.
    # This keeps checks/heartbeat alive even if the external trigger fails.
    # Runs 07:00-23:00 Israel time; hours 4-19 assume IDT (UTC+3, Israel's
    # summer DST) — shift both bounds by 1 after Israel's DST changes (roughly
    # late Oct and late Mar) to keep the same local window.
    - cron: "27 4-19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit state.json if changed
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update state.json"
            git push
          else
            echo "No state change to commit."
          fi
